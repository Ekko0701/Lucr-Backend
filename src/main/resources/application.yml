# ========================================
# Lucr — 공통 애플리케이션 설정
# ========================================
# 환경별 프로파일에서 오버라이드되지 않는 공통 설정만 포함
# 환경별 설정은 application-{profile}.yml 참조
#
# 작성자: Kim Dongjoo
# 작성일: 2026-02-27
# ========================================

spring:
  application:
    name: lucr

  # JPA 공통 설정
  jpa:
    open-in-view: false  # OSIV 비활성화 (성능 최적화)

  # 캐시 타입 (Redis)
  cache:
    type: redis

# JWT 설정 (환경 공통)
jwt:
  secret: ${JWT_SECRET}                   # 환경 변수 필수
  access-token-expiration: 1800000        # 30분 (밀리초)
  refresh-token-expiration: 604800000     # 7일 (밀리초)
  issuer: lucr-api

# 서버 포트
server:
  port: ${SERVER_PORT:8081}

# Actuator 공통 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized  # 인증된 사용자에게만 상세 정보 노출

# ========================================
# 활성 프로파일 선택
# ========================================
# 실행 시 환경 변수나 JVM 옵션으로 지정:
# - 로컬 개발: -Dspring.profiles.active=dev
# - AWS 운영: -Dspring.profiles.active=prod
# ========================================
